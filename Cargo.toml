[workspace]
members = ["crates/apr-core", "crates/apr-runtime", "crates/apr-cli", "crates/apr-mcp", "crates/apr-integrations", "crates/apr-connectors", "crates/apr-provider-jev"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/miguelfem/cookbook"
publish = false

[workspace.dependencies]
apr-core = { path = "crates/apr-core" }
apr-runtime = { path = "crates/apr-runtime" }
apr-mcp = { path = "crates/apr-mcp" }
apr-integrations = { path = "crates/apr-integrations" }
apr-connectors = { path = "crates/apr-connectors" }
apr-provider-jev = { path = "crates/apr-provider-jev" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
thiserror = "=2.0.18"
sha2 = "=0.10.9"
jsonschema = { version = "=0.33.0", default-features = false }
# 0.39.0 bundles SQLite 3.51.3, which fixes the WAL-reset corruption bug.
rusqlite = { version = "=0.39.0", features = ["bundled", "backup", "fallible_uint"] }
uuid = { version = "=1.22.0", features = ["v4"] }
tempfile = "=3.27.0"
zip = { version = "=9.0.5", default-features = false }
clap = { version = "=4.6.7", features = ["derive"] }
fs2 = "=0.4.3"
libc = "=0.2.191"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "=1.53.1", features = ["rt", "macros", "io-std", "io-util"] }
schemars = "=1.2.2"
signal-hook = { version = "=0.3.18", default-features = false }
toml_edit = "=0.25.15"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }
keyring = { version = "=3.6.3", default-features = false }
zeroize = "=1.8.2"

[profile.release]
lto = "thin"
strip = "symbols"
